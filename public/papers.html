<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Micromath research paper explanations."><title>Papers — Micromath</title>
<style>
:root{--bg:#0b1020;--surface:#111827;--surface2:#172033;--border:#263247;--text:#eef2f7;--muted:#9aa7b8;--accent:#7dd3fc;--strong:#38bdf8;--danger:#fb7185;--radius:14px;--max:1180px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,rgba(56,189,248,.08),transparent 32rem),var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,sans-serif}.container{width:min(calc(100% - 32px),var(--max));margin:auto}header{position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(148,163,184,.12);background:rgba(11,16,32,.86);backdrop-filter:blur(16px)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:750}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,var(--strong),#2563eb);color:#06111c;font-weight:900}nav{display:flex;gap:18px}nav a{color:var(--muted);text-decoration:none;font-size:14px}main{padding:64px 0 90px}.hero{margin-bottom:30px}h1{margin:0 0 10px;font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted)}.filters{display:grid;grid-template-columns:minmax(0,1fr) 180px 180px auto;gap:10px;margin:30px 0}input,select{min-height:44px;width:100%;border:1px solid var(--border);border-radius:9px;outline:0;background:var(--surface);color:var(--text);padding:0 13px}button{min-height:44px;padding:0 18px;border:0;border-radius:9px;background:var(--strong);color:#06111c;font-weight:800;cursor:pointer}.papers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.paper{display:flex;flex-direction:column;min-height:250px;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(17,24,39,.88);transition:border-color 140ms ease,transform 140ms ease}.paper:hover{transform:translateY(-2px);border-color:#3b4a63}.paper h2{margin:0 0 10px;font-size:19px;line-height:1.3}.paper h2 a{text-decoration:none}.paper h2 a:hover{color:var(--accent)}.excerpt{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}.paper-footer{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px}.tag{padding:4px 8px;border:1px solid var(--border);border-radius:999px;color:var(--accent);font-size:10px}.state{padding:40px 20px;border:1px solid var(--border);border-radius:var(--radius);color:var(--muted);text-align:center;background:rgba(17,24,39,.6);grid-column:1/-1}.error{color:#fecdd3;border-color:rgba(251,113,133,.3)}.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:30px}.pagination button{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.pagination button:disabled{opacity:.4;cursor:not-allowed}#pageInfo{color:var(--muted);font-size:13px}footer{padding:28px 0;border-top:1px solid rgba(148,163,184,.1);color:var(--muted);font-size:12px}@media(max-width:950px){.papers{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}}@media(max-width:620px){.container{width:min(calc(100% - 20px),var(--max))}nav{display:none}.papers,.filters{grid-template-columns:1fr}}
</style></head>
<body><header><div class="container nav"><a class="brand" href="./index.html"><span class="mark">M</span><span>Micromath</span></a><nav><a href="./index.html">Explain</a><a href="./papers.html">Papers</a></nav></div></header>
<main><div class="container"><section class="hero"><h1>Research Papers</h1><p>Explore published research explanations from Micromath.</p></section>
<section class="filters"><input id="search" type="search" placeholder="Search papers..." autocomplete="off"><select id="language"><option value="">All languages</option><option value="en">English</option><option value="hi">Hindi</option></select><select id="tag"><option value="">All tags</option></select><button id="searchButton" type="button">Search</button></section>
<section id="papers" class="papers" aria-live="polite"></section><div class="pagination"><button id="previous" type="button">Previous</button><span id="pageInfo">Page 1</span><button id="next" type="button">Next</button></div></div></main>
<footer><div class="container">Micromath Paper Explainer</div></footer>
<script>
"use strict";
const API_BASE=window.PAPER_EXPLAINER_API_BASE||"",papersElement=document.getElementById("papers"),searchElement=document.getElementById("search"),languageElement=document.getElementById("language"),tagElement=document.getElementById("tag"),searchButton=document.getElementById("searchButton"),previousButton=document.getElementById("previous"),nextButton=document.getElementById("next"),pageInfo=document.getElementById("pageInfo"),state={page:1,limit:12,total:0};
function apiUrl(path){return `${API_BASE.replace(/\/+$/,"")}${path}`}function escapeHtml(v){const e=document.createElement("div");e.textContent=v??"";return e.innerHTML}function excerpt(v){const t=String(v||"").replace(/[#*_>\`~]/g,"").replace(/\s+/g," ").trim();return t.length>220?`${t.slice(0,220)}…`:t}function formatDate(v){if(!v)return"";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("en-IN",{year:"numeric",month:"short",day:"numeric"}).format(d)}
function renderLoading(){papersElement.innerHTML='<div class="state">Loading papers…</div>'}function renderError(m){papersElement.innerHTML=`<div class="state error">${escapeHtml(m)}</div>`}
function renderPapers(items){if(!items.length){papersElement.innerHTML='<div class="state">No papers found.</div>';return}papersElement.innerHTML=items.map(p=>{const tags=Array.isArray(p.tags)?p.tags:[],tagHtml=tags.slice(0,5).map(t=>`<span class="tag">${escapeHtml(typeof t==="string"?t:t.name||t.slug||"")}</span>`).join(""),href=`./paper.html?slug=${encodeURIComponent(p.slug)}`;return `<article class="paper"><h2><a href="${href}">${escapeHtml(p.title)}</a></h2><p class="excerpt">${escapeHtml(excerpt(p.excerpt||p.content||p.explanation))}</p><div class="tags">${tagHtml}</div><div class="paper-footer"><span>${escapeHtml(p.lang||p.language||"")}</span><span>${escapeHtml(formatDate(p.published_at||p.created_at))}</span></div></article>`}).join("")}
function updatePagination(){const totalPages=Math.max(1,Math.ceil(state.total/state.limit));pageInfo.textContent=`Page ${state.page} of ${totalPages}`;previousButton.disabled=state.page<=1;nextButton.disabled=state.page>=totalPages}
async function loadPapers(){renderLoading();const params=new URLSearchParams({page:String(state.page),limit:String(state.limit)}),q=searchElement.value.trim();if(q)params.set("q",q);if(languageElement.value)params.set("lang",languageElement.value);if(tagElement.value)params.set("tag",tagElement.value);try{const r=await fetch(apiUrl(`/api/papers?${params}`)),d=await r.json();if(!r.ok)throw new Error(typeof d.error==="string"?d.error:`Request failed with status ${r.status}`);const items=Array.isArray(d.papers)?d.papers:Array.isArray(d.items)?d.items:[];state.total=Number.isFinite(d.pagination?.total)?d.pagination.total:Number.isFinite(d.total)?d.total:items.length;renderPapers(items);updatePagination()}catch(e){state.total=0;renderError(e instanceof Error?e.message:"Unable to load papers.");updatePagination()}}
async function loadTags(){try{const r=await fetch(apiUrl("/api/tags"));if(!r.ok)return;const d=await r.json(),tags=Array.isArray(d.tags)?d.tags:Array.isArray(d)?d:[];for(const t of tags){const name=typeof t==="string"?t:t.name||t.slug||"",slug=typeof t==="string"?t:t.slug||t.name||"";if(!name||!slug)continue;const o=document.createElement("option");o.value=slug;o.textContent=name;tagElement.appendChild(o)}}catch{}}
function resetAndLoad(){state.page=1;loadPapers()}searchButton.addEventListener("click",resetAndLoad);languageElement.addEventListener("change",resetAndLoad);tagElement.addEventListener("change",resetAndLoad);searchElement.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();resetAndLoad()}});previousButton.addEventListener("click",()=>{if(state.page>1){state.page--;loadPapers();window.scrollTo({top:0,behavior:"smooth"})}});nextButton.addEventListener("click",()=>{const totalPages=Math.max(1,Math.ceil(state.total/state.limit));if(state.page<totalPages){state.page++;loadPapers();window.scrollTo({top:0,behavior:"smooth"})}});loadTags();loadPapers();
</script></body></html>
