<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta id="description" name="description" content="Micromath research paper explanation."><title>Paper — Micromath</title>
<style>
:root{--bg:#0b1020;--surface:#111827;--surface2:#172033;--border:#263247;--text:#eef2f7;--muted:#9aa7b8;--accent:#7dd3fc;--strong:#38bdf8;--danger:#fb7185;--max:900px;--radius:14px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(56,189,248,.08),transparent 35rem),var(--bg);color:var(--text);font:16px/1.7 Inter,ui-sans-serif,system-ui,sans-serif}.container{width:min(calc(100% - 32px),var(--max));margin:auto}header{border-bottom:1px solid rgba(148,163,184,.12);background:rgba(11,16,32,.84);backdrop-filter:blur(16px)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:750}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,var(--strong),#2563eb);color:#06111c;font-weight:900}nav{display:flex;gap:18px}nav a{color:var(--muted);text-decoration:none;font-size:14px}main{padding:70px 0 90px}.article{padding:34px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(17,24,39,.86)}.back{display:inline-block;margin-bottom:30px;color:var(--accent);text-decoration:none;font-size:13px}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.badge{padding:5px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:11px}h1{margin:0 0 18px;font-size:clamp(34px,6vw,60px);line-height:1.06;letter-spacing:-.045em}.meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px;color:var(--muted);font-size:12px}.content{font-size:16px;color:#dbe4ef}.content h1,.content h2,.content h3,.content h4{line-height:1.25;margin-top:1.7em;margin-bottom:.7em;color:var(--text)}.content h1{font-size:30px}.content h2{font-size:24px}.content h3{font-size:19px}.content p{margin:0 0 1.2em}.content img{display:block;max-width:100%;height:auto;margin:25px auto;border-radius:10px}.content blockquote{margin:24px 0;padding:10px 20px;border-left:3px solid var(--accent);background:rgba(125,211,252,.04);color:var(--muted)}.content pre{overflow-x:auto;padding:17px;border:1px solid var(--border);border-radius:10px;background:#080c16}.content code{font-family:"JetBrains Mono",monospace;font-size:.9em}.content :not(pre)>code{padding:2px 5px;border-radius:5px;background:#080c16;color:#bae6fd}.content table{width:100%;border-collapse:collapse;margin:25px 0;overflow-x:auto;display:block}.content th,.content td{padding:9px 12px;border:1px solid var(--border);text-align:left}.content th{background:var(--surface2)}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:35px;padding-top:20px;border-top:1px solid var(--border)}.tag{padding:5px 9px;border:1px solid var(--border);border-radius:999px;color:var(--accent);font-size:11px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}button{min-height:40px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);cursor:pointer}.state{padding:50px 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);text-align:center;color:var(--muted)}.error{color:#fecdd3;border-color:rgba(251,113,133,.3)}footer{padding:28px 0;border-top:1px solid rgba(148,163,184,.1);color:var(--muted);font-size:12px}@media(max-width:620px){.container{width:min(calc(100% - 20px),var(--max))}nav{display:none}main{padding-top:35px}.article{padding:22px}}
</style></head>
<body><header><div class="container nav"><a class="brand" href="./index.html"><span class="mark">M</span><span>Micromath</span></a><nav><a href="./index.html">Explain</a><a href="./papers.html">Papers</a></nav></div></header>
<main><div class="container"><article class="article"><a class="back" href="./papers.html">← All papers</a><div id="loading" class="state">Loading paper…</div><div id="content" hidden><div id="eyebrow" class="eyebrow"></div><h1 id="title"></h1><div id="meta" class="meta"></div><div id="body" class="content"></div><div id="tags" class="tags"></div><div class="actions"><button id="share" type="button">Copy link</button></div></div></article></div></main>
<footer><div class="container">Micromath Paper Explainer</div></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
const API_BASE=window.PAPER_EXPLAINER_API_BASE||"",loading=document.getElementById("loading"),content=document.getElementById("content"),titleElement=document.getElementById("title"),descriptionElement=document.getElementById("description"),eyebrowElement=document.getElementById("eyebrow"),metaElement=document.getElementById("meta"),bodyElement=document.getElementById("body"),tagsElement=document.getElementById("tags"),shareButton=document.getElementById("share");
function apiUrl(path){return `${API_BASE.replace(/\/+$/,"")}${path}`}function formatDate(v){if(!v)return"";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("en-IN",{year:"numeric",month:"long",day:"numeric"}).format(d)}function showError(m){loading.className="state error";loading.textContent=m;content.hidden=true}
function renderTags(tags){tagsElement.innerHTML="";if(!Array.isArray(tags))return;for(const t of tags){const name=typeof t==="string"?t:t.name||t.slug||"";if(!name)continue;const e=document.createElement("span");e.className="tag";e.textContent=name;tagsElement.appendChild(e)}}
function renderPaper(p){document.title=`${p.title||"Paper"} — Micromath`;if(p.excerpt)descriptionElement.content=String(p.excerpt).slice(0,300);titleElement.textContent=p.title||"Untitled paper";eyebrowElement.innerHTML="";const lang=p.lang||p.language||"";if(lang){const b=document.createElement("span");b.className="badge";b.textContent=lang;eyebrowElement.appendChild(b)}const meta=[p.author_name||p.author||"",formatDate(p.published_at||p.created_at),Number.isFinite(Number(p.views))?`${Number(p.views)} views`:""].filter(Boolean);metaElement.textContent=meta.join(" · ");bodyElement.innerHTML=marked.parse(p.explanation||p.content||"",{gfm:true,breaks:true});renderTags(p.tags);loading.hidden=true;content.hidden=false}
async function loadPaper(){const slug=new URLSearchParams(location.search).get("slug");if(!slug){showError("No paper slug was provided.");return}try{const r=await fetch(apiUrl(`/api/papers/${encodeURIComponent(slug)}`)),d=await r.json();if(!r.ok)throw new Error(typeof d.error==="string"?d.error:`Paper request failed with status ${r.status}`);const p=d.paper||d;if(!p||typeof p!=="object")throw new Error("The server returned invalid paper data.");renderPaper(p)}catch(e){showError(e instanceof Error?e.message:"Unable to load this paper.")}}
shareButton.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href);shareButton.textContent="Link copied"}catch{shareButton.textContent="Copy failed"}setTimeout(()=>shareButton.textContent="Copy link",1800)});loadPaper();
</script></body></html>
