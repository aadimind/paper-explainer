name: Deploy Paper Explainer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-explainer-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '*'

      - name: Install dependencies
        run: npm install

      - name: Create local CI configuration
        run: |
          cat > wrangler.ci.toml <<'EOF'
          name = "paper-explainer-ci"
          main = "src/index.js"
          compatibility_date = "2026-09-20"

          [ai]
          binding = "AI"

          [[d1_databases]]
          binding = "DB"
          database_name = "paper-explainer-db"
          database_id = "00000000-0000-4000-8000-000000000001"

          [[kv_namespaces]]
          binding = "KV"
          id = "00000000-0000-4000-8000-000000000002"

          [vars]
          SITE_NAME = "Paper Explained CI"
          SITE_URL = "http://127.0.0.1:8787"
          ALLOWED_ORIGIN = "http://127.0.0.1:8787"
          EOF

      - name: Initialize local D1
        run: npx wrangler d1 execute paper-explainer-db --local --config=wrangler.ci.toml --file=schema.sql

      - name: Start local Worker
        run: |
          nohup npx wrangler dev --local --config=wrangler.ci.toml --ip=127.0.0.1 --port=8787 > wrangler-ci.log 2>&1 &
          echo $! > wrangler-ci.pid

      - name: Wait for Worker
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/papers > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat wrangler-ci.log
          exit 1

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8787
        run: npm test

      - name: Stop local Worker
        if: always()
        run: |
          if [ -f wrangler-ci.pid ]; then
            kill "$(cat wrangler-ci.pid)" 2>/dev/null || true
          fi

  deploy-worker:
    name: Deploy Worker
    needs:
      - test
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '*'

      - name: Install dependencies
        run: npm install

      - name: Apply production D1 schema
        run: npx wrangler d1 execute paper-explainer-db --remote --file=schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
